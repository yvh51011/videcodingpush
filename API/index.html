<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Chat Partner</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --bubble-bot: #243044;
      --bubble-user: #2d6a4f;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #52b788;
      --border: #2a3548;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .settings {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .settings input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      width: min(280px, 70vw);
    }

    .settings button,
    #sendBtn,
    #clearBtn {
      background: var(--accent);
      color: #0a1a12;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .settings button.secondary,
    #clearBtn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      max-width: 100%;
    }

    .msg .citations {
      margin-top: 0.65rem;
      padding-top: 0.55rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .msg .citations a {
      color: var(--accent);
      display: block;
      margin-top: 0.25rem;
      word-break: break-all;
    }

    .typing {
      align-self: flex-start;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
    }

    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 0.9rem 1.25rem;
    }

    .composer {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      font-family: inherit;
    }

    #input:focus,
    .settings input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>English Chat Partner</h1>
      <p>영어 대화 연습 · 최신 정보는 Web Search로 검색 · 막히면 한국어 OK</p>
    </div>
    <div class="settings">
      <input id="apiKey" type="password" placeholder="OpenAI API Key (sk-...)" autocomplete="off" />
      <button type="button" id="saveKey">저장</button>
      <button type="button" class="secondary" id="clearBtn">대화 초기화</button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type in English... (Enter to send)"></textarea>
      <button type="button" id="sendBtn">Send</button>
    </div>
  </footer>

  <script>
    const SYSTEM_PROMPT = `You are a patient English conversation partner for Korean learners (CEFR A1–B1).
Rules:
- Speak mainly in English at a level the learner can follow.
- Ask ONE clear question at a time. Keep replies short so the learner speaks more.
- Correct only 1–2 important errors when needed, using this format briefly:
  My sentence: ...
  Corrected: ...
  More natural: ... (optional)
  Why: one short line (Korean OK)
  Then ask them to try again, then continue.
- If the learner is stuck or asks in Korean, explain briefly in Korean, then return to English.
- Be warm and encouraging. No long lectures.
- You have web search. Use it when the learner asks about news, current events, facts, places, or anything that needs up-to-date info. Keep search-based answers short and conversation-friendly; mention sources briefly when helpful.`;

    const MODEL = "gpt-4o";
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const apiKeyEl = document.getElementById("apiKey");
    const saveKeyBtn = document.getElementById("saveKey");
    const clearBtn = document.getElementById("clearBtn");

    let previousResponseId = null;
    let busy = false;

    const saved = localStorage.getItem("openai_api_key");
    if (saved) apiKeyEl.value = saved;

    function addBubble(text, who, citations) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;

      if (citations && citations.length) {
        const box = document.createElement("div");
        box.className = "citations";
        box.appendChild(document.createTextNode("Sources"));
        citations.forEach((c) => {
          const a = document.createElement("a");
          a.href = c.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = c.title || c.url;
          box.appendChild(a);
        });
        div.appendChild(box);
      }

      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
    }

    function extractReply(data) {
      if (data.output_text && data.output_text.trim()) {
        return data.output_text.trim();
      }
      const parts = [];
      for (const item of data.output || []) {
        if (item.type !== "message") continue;
        for (const c of item.content || []) {
          if (c.type === "output_text" && c.text) parts.push(c.text);
        }
      }
      return parts.join("\n").trim() || "(no reply)";
    }

    function extractCitations(data) {
      const seen = new Set();
      const list = [];
      for (const item of data.output || []) {
        if (item.type !== "message") continue;
        for (const c of item.content || []) {
          for (const a of c.annotations || []) {
            if (a.type !== "url_citation" || !a.url || seen.has(a.url)) continue;
            seen.add(a.url);
            list.push({ url: a.url, title: a.title || a.url });
          }
        }
      }
      return list;
    }

    function didSearch(data) {
      return (data.output || []).some((item) => item.type === "web_search_call");
    }

    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyEl.value.trim();
      if (!key) {
        addBubble("API 키를 입력해 주세요.", "system");
        return;
      }
      localStorage.setItem("openai_api_key", key);
      addBubble("API 키가 이 브라우저에 저장됐어요.", "system");
    });

    clearBtn.addEventListener("click", () => {
      previousResponseId = null;
      chatEl.innerHTML = "";
      addBubble("대화가 초기화됐어요. 영어로 인사를 보내 보세요!", "system");
      addBubble(
        "Hi! I'm your English chat partner with web search. Ask about news, facts, or just chat!",
        "bot"
      );
    });

    async function send() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      const apiKey = apiKeyEl.value.trim() || localStorage.getItem("openai_api_key");
      if (!apiKey) {
        addBubble("먼저 상단에 OpenAI API Key를 입력하고 저장해 주세요.", "system");
        return;
      }

      addBubble(text, "user");
      inputEl.value = "";
      setBusy(true);

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Thinking / searching...";
      chatEl.appendChild(typing);
      chatEl.scrollTop = chatEl.scrollHeight;

      const body = {
        model: MODEL,
        instructions: SYSTEM_PROMPT,
        tools: [{ type: "web_search" }],
        input: text,
        temperature: 0.7,
      };
      if (previousResponseId) {
        body.previous_response_id = previousResponseId;
      }

      try {
        const res = await fetch("https://api.openai.com/v1/responses", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + apiKey,
          },
          body: JSON.stringify(body),
        });

        const data = await res.json();
        typing.remove();

        if (!res.ok) {
          const err = data.error?.message || res.statusText;
          addBubble("오류: " + err, "system");
          return;
        }

        previousResponseId = data.id || previousResponseId;
        const reply = extractReply(data);
        const citations = extractCitations(data);
        if (didSearch(data)) {
          addBubble("🔎 Web search used", "system");
        }
        addBubble(reply, "bot", citations);
      } catch (e) {
        typing.remove();
        addBubble("네트워크 오류: " + e.message, "system");
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    addBubble(
      "Hi! I'm your English chat partner with web search. Ask about news, facts, or just chat!",
      "bot"
    );
  </script>
</body>
</html>
