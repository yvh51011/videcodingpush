<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Proverb Bot</title>
  <style>
    :root {
      --bg: #1a120b;
      --panel: #2a1f14;
      --bubble-bot: #3d2e1f;
      --bubble-user: #8b5a2b;
      --text: #f5ebe0;
      --muted: #b89b7a;
      --accent: #e9c46a;
      --border: #4a3728;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at top, #2c1e12 0%, var(--bg) 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: rgba(42, 31, 20, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .settings {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .settings input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      width: min(280px, 70vw);
    }

    .settings button,
    #sendBtn,
    #clearBtn {
      background: var(--accent);
      color: #1a120b;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .settings button.secondary,
    #clearBtn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .quick {
      max-width: 720px;
      width: 100%;
      margin: 0.75rem auto 0;
      padding: 0 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .quick button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .quick button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: 88%;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      max-width: 100%;
    }

    .typing {
      align-self: flex-start;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
    }

    footer {
      border-top: 1px solid var(--border);
      background: rgba(42, 31, 20, 0.95);
      padding: 0.9rem 1.25rem;
    }

    .composer {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      font-family: inherit;
    }

    #input:focus,
    .settings input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>English Proverb Bot</h1>
      <p>영어 속담 · 뜻 · 비슷한 한국 속담 · 예문까지 알려드려요</p>
    </div>
    <div class="settings">
      <input id="apiKey" type="password" placeholder="Gemini API Key" autocomplete="off" />
      <button type="button" id="saveKey">저장</button>
      <button type="button" class="secondary" id="clearBtn">대화 초기화</button>
    </div>
  </header>

  <div class="quick">
    <button type="button" data-q="오늘 배울 속담 하나 알려줘">랜덤 속담</button>
    <button type="button" data-q="노력과 관련된 영어 속담 알려줘">노력</button>
    <button type="button" data-q="우정에 관한 영어 속담 알려줘">우정</button>
    <button type="button" data-q="시간이 소중한 내용의 영어 속담 알려줘">시간</button>
    <button type="button" data-q="A stitch in time saves nine 뜻 설명해줘">뜻 설명</button>
  </div>

  <main id="chat"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="예: 인내에 관한 속담 알려줘 / Don't count your chickens... 뜻은?"></textarea>
      <button type="button" id="sendBtn">Send</button>
    </div>
  </footer>

  <script>
    const SYSTEM_PROMPT = `당신은 한국인 학습자를 위한 친절한 영어 속담(English proverb / idiom) 선생님입니다.

매 응답에서 가능하면 아래 형식을 따르세요:
1) Proverb: 영어 속담
2) Meaning (EN): 쉬운 영어 뜻
3) 한국어 뜻: 한 문장
4) Similar Korean: 비슷한 한국 속담 (없으면 "비슷한 표현 없음")
5) Example: 짧은 영어 예문 1개 + 한국어 해석
6) Tip: 언제 쓰는지 한 줄 팁

규칙:
- 한 번에 속담 1~2개만 소개 (요청하면 더 많이)
- 대화는 이어가고, 질문에는 짧게 먼저 답한 뒤 형식 사용
- 모르는 속담이면 솔직히 말하고 비슷한 표현을 제안
- 따뜻하고 쉬운 말투, 긴 강의는 하지 않기`;

    const MODEL = "gemini-3.8-flash";
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const apiKeyEl = document.getElementById("apiKey");
    const saveKeyBtn = document.getElementById("saveKey");
    const clearBtn = document.getElementById("clearBtn");

    /** @type {{ role: "user" | "model", parts: { text: string }[] }[]} */
    let history = [];
    let busy = false;

    const saved = localStorage.getItem("gemini_api_key");
    if (saved) apiKeyEl.value = saved;

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
    }

    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyEl.value.trim();
      if (!key) {
        addBubble("Gemini API 키를 입력해 주세요.", "system");
        return;
      }
      localStorage.setItem("gemini_api_key", key);
      addBubble("API 키가 이 브라우저에 저장됐어요.", "system");
    });

    clearBtn.addEventListener("click", () => {
      history = [];
      chatEl.innerHTML = "";
      addBubble("대화가 초기화됐어요. 속담을 물어보세요!", "system");
      greet();
    });

    document.querySelectorAll(".quick button").forEach((btn) => {
      btn.addEventListener("click", () => {
        inputEl.value = btn.dataset.q;
        send();
      });
    });

    async function send() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      const apiKey = apiKeyEl.value.trim() || localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        addBubble("먼저 상단에 Gemini API Key를 입력하고 저장해 주세요. (.env의 gemini_api_key)", "system");
        return;
      }

      addBubble(text, "user");
      inputEl.value = "";
      history.push({ role: "user", parts: [{ text }] });
      setBusy(true);

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Searching my proverb book...";
      chatEl.appendChild(typing);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey,
            },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: history,
              generationConfig: { temperature: 0.7 },
            }),
          }
        );

        const data = await res.json();
        typing.remove();

        if (!res.ok) {
          const err = data.error?.message || res.statusText;
          addBubble("오류: " + err, "system");
          history.pop();
          return;
        }

        const reply =
          data.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("")?.trim() ||
          "(응답 없음)";

        history.push({ role: "model", parts: [{ text: reply }] });
        addBubble(reply, "bot");
      } catch (e) {
        typing.remove();
        addBubble("네트워크 오류: " + e.message, "system");
        history.pop();
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    function greet() {
      const hello =
        "Hello! I'm your English Proverb Bot.\n\n" +
        "Ask me for a random proverb, a theme (effort, friendship, time…),\n" +
        "or paste a proverb and I'll explain it in Korean.";
      addBubble(hello, "bot");
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    greet();
  </script>
</body>
</html>
