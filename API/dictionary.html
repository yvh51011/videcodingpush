<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxford Dictionary</title>
  <style>
    :root {
      --bg: #0e1621;
      --panel: #162033;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #4cc9f0;
      --border: #243247;
      --card: #1a2740;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2a40 0%, var(--bg) 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.35rem;
      line-height: 1.5;
    }

    .note {
      margin-top: 0.9rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .search {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.6rem;
    }

    #word {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 1rem;
    }

    #word:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      background: var(--accent);
      color: #041018;
      border: none;
      padding: 0.75rem 1.1rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .quick button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    #status {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      min-height: 1.2em;
    }

    #result {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }

    .word-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .phonetic {
      color: var(--accent);
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .pos {
      display: inline-block;
      margin-top: 0.85rem;
      margin-bottom: 0.4rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    .def {
      margin-top: 0.55rem;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .example {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.88rem;
      font-style: italic;
    }

    .error {
      color: #ff8a8a;
      white-space: pre-wrap;
    }

    nav {
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }

    nav a {
      color: var(--accent);
      margin-right: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Oxford Dictionary</h1>
      <p>Oxford Dictionaries Sandbox API로 영어 단어 뜻을 조회합니다.</p>
      <div class="note">
        Sandbox 제한: <strong>a로 시작하는 단어</strong>만 조회됩니다 (예: apple, amazing).
        서버를 <code>node server.js</code>로 실행한 뒤 이 페이지를 열어 주세요.
      </div>
    </header>

    <div class="search">
      <input id="word" type="text" placeholder="예: apple, amazing, advice..." autofocus />
      <button type="button" id="lookupBtn">Lookup</button>
    </div>

    <div class="quick">
      <button type="button" data-w="apple">apple</button>
      <button type="button" data-w="amazing">amazing</button>
      <button type="button" data-w="advice">advice</button>
      <button type="button" data-w="abandon">abandon</button>
    </div>

    <div id="status"></div>
    <div id="result"></div>

    <nav>
      <a href="/index.html">English Chat</a>
      <a href="/proverb.html">Proverb Bot</a>
    </nav>
  </div>

  <script>
    const wordEl = document.getElementById("word");
    const btn = document.getElementById("lookupBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    document.querySelectorAll(".quick button").forEach((b) => {
      b.addEventListener("click", () => {
        wordEl.value = b.dataset.w;
        lookup();
      });
    });

    btn.addEventListener("click", lookup);
    wordEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") lookup();
    });

    function extractDefs(data) {
      const out = [];
      const results = data.results || [];
      for (const r of results) {
        const word = r.word || "";
        let phonetic = "";
        const senses = [];
        for (const lex of r.lexicalEntries || []) {
          const pos = lex.lexicalCategory?.text || lex.lexicalCategory?.id || "";
          for (const entry of lex.entries || []) {
            for (const p of entry.pronunciations || []) {
              if (p.phoneticSpelling) phonetic = p.phoneticSpelling;
            }
            for (const s of entry.senses || []) {
              const defs = s.definitions || [];
              const exs = (s.examples || []).map((e) => e.text).filter(Boolean);
              senses.push({
                pos,
                definition: defs[0] || "",
                example: exs[0] || "",
              });
            }
          }
        }
        out.push({ word, phonetic, senses });
      }
      return out;
    }

    async function lookup() {
      const word = wordEl.value.trim().toLowerCase();
      if (!word) return;

      btn.disabled = true;
      statusEl.textContent = "Looking up...";
      statusEl.className = "";
      resultEl.innerHTML = "";

      try {
        const res = await fetch(
          `/api/oxford/entries/en-gb/${encodeURIComponent(word)}`
        );
        const data = await res.json();

        if (!res.ok) {
          let msg = data.error || data.message || `HTTP ${res.status}`;
          if (res.status === 404) {
            msg =
              `"${word}"를 찾지 못했습니다.\n` +
              "Sandbox는 a로 시작하는 단어만 지원합니다. (apple, amazing…)";
          }
          statusEl.textContent = "";
          resultEl.innerHTML = `<div class="card error">${msg}</div>`;
          return;
        }

        const entries = extractDefs(data);
        if (!entries.length) {
          statusEl.textContent = "";
          resultEl.innerHTML = `<div class="card error">결과가 비어 있습니다.</div>`;
          return;
        }

        statusEl.textContent = "OK · Oxford Sandbox";
        for (const e of entries) {
          const card = document.createElement("div");
          card.className = "card";
          let html = `<div class="word-title">${e.word}</div>`;
          if (e.phonetic) html += `<div class="phonetic">/${e.phonetic}/</div>`;
          for (const s of e.senses.slice(0, 6)) {
            if (s.pos) html += `<div class="pos">${s.pos}</div>`;
            if (s.definition) html += `<div class="def">${s.definition}</div>`;
            if (s.example) html += `<div class="example">“${s.example}”</div>`;
          }
          card.innerHTML = html;
          resultEl.appendChild(card);
        }
      } catch (err) {
        statusEl.textContent = "";
        resultEl.innerHTML =
          `<div class="card error">연결 실패: ${err.message}\n` +
          `터미널에서 node server.js 를 실행했는지 확인해 주세요.</div>`;
      } finally {
        btn.disabled = false;
        wordEl.focus();
      }
    }
  </script>
</body>
</html>
